
apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-portal
  labels:
    app: road-hazard-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: road-hazard-portal
  template:
    metadata:
      labels:
        app: road-hazard-portal
    spec:
      containers:
        - name: portal
          image: YOUR-DOCKERHUB-USERNAME/road-hazard-portal:1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-portal-service
spec:
  type: NodePort
  selector:
    app: road-hazard-portal
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
