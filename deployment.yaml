
apiVersion: apps/v1
kind: Deployment
metadata:
  name: road-hazard-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: road-hazard-portal
  template:
    metadata:
      labels:
        app: road-hazard-portal
    spec:
      containers:
        - name: portal
          image: road-hazard-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: road-hazard-portal-service
spec:
  type: NodePort
  selector:
    app: road-hazard-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
